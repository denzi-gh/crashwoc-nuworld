schema = 1

[units]
"nucore/fixcore" = { treatment = "compile", override = ["FixLoad"], wrap = ["FixLocal"] }
"numath/fixasm" = { treatment = "hle" }
"game/fixgame" = { treatment = "compile", rename = { main = "nw_game_main" } }
"game/fixdead" = { treatment = "dead" }
"game/fixdata" = { treatment = "compile", override = ["FixDataHidden"] }
"sdk/*" = { treatment = "shim" }
