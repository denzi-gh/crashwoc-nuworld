# Data image annotations; checked by `python tools/gen_dataimage.py --check`.
# owned: roots NuWorld defines itself (src/shim, src/port), left out of the image
# conflicts: roots plain in one unit and with pointer slots in another, accepted with a reason (better: fix upstream)
# reads: overridden functions whose data stays in the image for NuWorld's copy
# Every entry must match a root.

schema = 1

[owned]
"_gp" = "EE linker symbol: bgload passes &_gp as the loader thread's gp register; the host never reads it"
"_impure_ptr" = "newlib reent block (src/shim/libc.c): retail impure_data holds an SDK code pointer (_cleanup_r)"
"nw_wide" = "the widescreen view (src/port/wide.c) the NW_WIDE seams read; retail has none"
"nw_hz" = "the game logic's rate (src/port/hz.c) the NW_HZ seams read; retail has none"

[conflicts]

[reads]
"Text3D" = "src/port/font3d.c is retail's Text3D with the button prompts; it reads the same font tables"
