# Data image annotations; checked by `python tools/gen_dataimage.py --check`.
# owned: data roots the port defines itself (src/shim, src/port), so the image leaves them out
# conflicts: roots declared as plain data in one unit and with pointer slots in another, accepted with
#   the reason (fix the declaration upstream instead whenever possible)
# Every entry must match a root, so a decomp bump cannot leave a stale one.

schema = 1

[owned]
"_gp" = "EE linker symbol: bgload passes &_gp as the loader thread's gp register; the host never reads it"
"_impure_ptr" = "newlib reent block (src/shim/libc.c): retail impure_data holds an SDK code pointer (_cleanup_r)"

[conflicts]
