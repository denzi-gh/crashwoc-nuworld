# Converter annotations; checked by `python tools/gen_converters.py --check`.
# unions: a union mixing pointers with other members converts through `member`, or with `hook = true` through
#   nw_xh_<T> / nw_xhr_<T> in src/data/xhooks.c (`$n` and `.` become `__` in the name)
# arrays: a [0] or [] array needs `hook = true`
# Anything else that needs an entry is a generator error.

schema = 1

[unions]
# numtl/nuwater read only .s32 and .f32; .voidptr is never used.
"union nufx_u" = { member = "u32" }
# A .gsc colour reference: the scene loader reads them in place, nothing converts one.
"struct nucolourref_s$1" = { member = "addr_offset" }
"struct nucolourref_s$2" = { member = "cols" }
# The per-curve flags decide; the .cut loader converts these.
"union nuanimcurve2_u" = { hook = true }
# The .shd table: file offsets, which the port's ShadDataLoad turns into its own records.
"union shadslot_u" = { member = "offset" }
# Editor-only: built at runtime, never in the retail data image.
"struct eduiitem_s$1" = { hook = true }
"struct eduiitem_s$2" = { hook = true }

[arrays]
"struct eduimenu_s.titlebuf" = { hook = true }
# The .DAT directory behind the header: built when an archive opens (NuDat*), never in the data image.
"struct nudathdr_s.data" = { hook = true }
"struct nucolourref_s$2.pair" = { hook = true }
