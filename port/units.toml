# Host treatment per decomp unit; checked by `python tools/gen_stubs.py --check`.
# treatment: compile | editor (stubs unless built with the editor) | hle | replace | dead (stubs) | shim
# override/keep: globs NuWorld defines instead of the decomp (without a NuWorld definition: a stub)
# rename: decomp -> host name within the unit, for symbol collisions
# wrap: the decomp C stays as <name>__retail (<unit>.retail.h); NuWorld's <name> takes every call
# expose: file statics (functions or data) made global; a static function is exposed before it is wrapped
# runtime: globs of an editor unit that retail calls outside the editor, compiled in every build
# called: stubs of an editor or dead unit behind guards retail never passes; any other call into one is an error
# Overrides marked "dead": code retail never reaches whose C does not build for the host.

schema = 1

[units]
# nucore
"nucore/nufile" = { treatment = "compile", override = ["NuDat*"], keep = ["NuDatOpen", "NuDatSet"] }
"nucore/nufpar" = { treatment = "compile" }
# NuErrorProlog: the file and line NuErrorFunction prints are nuerror.c statics
"nucore/nuerror" = { treatment = "compile", override = ["NuErrorProlog", "NuErrorFunction"] }
"nucore/numem" = { treatment = "compile" }
"nucore/numemblk" = { treatment = "compile" }
"nucore/numemhi" = { treatment = "compile" }
"nucore/nulist" = { treatment = "compile" }
"nucore/nustring" = { treatment = "compile" }
"nucore/asmmem" = { treatment = "hle" }
"nucore/rnc" = { treatment = "compile" }

# numath
"numath/nuvec" = { treatment = "compile", override = ["NuVecNorm"] }
"numath/nuvec4" = { treatment = "compile" }
"numath/numtx" = { treatment = "compile" }
"numath/nutrig" = { treatment = "compile", override = ["NuTrigInit"] }
"numath/nufloat" = { treatment = "compile" }
"numath/nuquat" = { treatment = "compile" }
"numath/nuplane" = { treatment = "compile" }
"numath/numtxvu0" = { treatment = "hle" }
"numath/nuvecvu0" = { treatment = "hle" }
"numath/nuplnvu0" = { treatment = "hle" }
"numath/nurand" = { treatment = "compile" }
"numath/nupatch" = { treatment = "compile" }
"numath/numath" = { treatment = "hle" }

# nu3d
"nu3d/nustream" = { treatment = "compile", override = ["*"], keep = ["NuRndrStreamResetStream", "NuRndrSwapStreamBuffers",
    "NuRndrSetGlobalAlpha", "NuRndrStreamSetDirectionalLights", "NuRndrStreamSetAmbientLight"] }
"nu3d/nucamera" = { treatment = "compile" }
"nu3d/nucamvu0" = { treatment = "hle" }
"nu3d/nuvport" = { treatment = "compile" }
"nu3d/nugobj" = { treatment = "compile" }
"nu3d/nunode" = { treatment = "compile" }
# nugscn defines a global ReadNuIFFGeomVtx too; dead: NuNodeRead, ReadNuIFFTextureSet
"nu3d/nuscene" = { treatment = "compile", override = ["NuNodeRead", "ReadNuIFFTextureSet"], rename = { ReadNuIFFGeomVtx = "ReadNuIFFGeomVtx__nuscene" } }
"nu3d/numtl" = { treatment = "compile", override = ["CreateStateBlock", "NuMtlBuildRenderList"], wrap = ["NuMtlRelease"] }
"nu3d/nutex" = { treatment = "compile", override = ["NuTexCreateNative"] }
# kept: shadow, footprint and ripple bookkeeping and draws, volume-shadow boxes, bodies retail leaves empty.
# NuRndrFxCode's Z-byte light passes are unreachable here (depth CLUTs instead).
"nu3d/nurndr" = { treatment = "compile", override = ["*"], keep = ["NuHGobjEval*", "ClipLinePoint", "NuRndrEndScene",
    "NuRndrEndSceneEx", "NuHGobjRndrMtx", "NuRndrSplineSearch", "NuRndrInitWorld", "NuRndrShadowInit",
    "NuRndrShadowOnOff", "NuRndrAddShadow", "NuRndrAnglesZX", "NuRndrAddFootPrint", "NuRndrAddWaterRipple",
    "NuRndrWaterRippleUpdate", "NuRndrWaterLevelTint", "NuRndrShadPolys", "NuRndrWaterRip", "NuRndrFx", "NuRndrClose",
    "NuRndrShadowStencil", "NuRndrShadowDirCol", "RotateCyl", "DeRotateVectorAngles", "NuRndrFog*", "NuRndrLine3dDbg*",
    "NuRndrTest", "NuRndrQuad3d", "NuRndrStarfield"] }
"nu3d/nufont" = { treatment = "compile" }
"nu3d/nulight" = { treatment = "compile", override = ["NuLightHaze", "NuLightPolyHaze", "NuLightFogDraw",
    "NuLgtArcLaserDraw", "NuLightProcessSpot", "NuLightFxSetup"] }
# *FixPtrs (an int base): done by NuAnimDataLoadBuff and NuGCutSceneLoad; curve evaluators: src/hle/nuanim.c
"nu3d/nuanim" = { treatment = "compile", override = ["NuAnimDataLoadBuff", "NuAnimDataFixPtrs", "NuAnimData2FixPtrs",
    "NuAnimCurveCalcVal2", "NuAnimCurve2CalcVal"], expose = ["isBitCountTable"] }
# dead: the CvtNuIFF* converter path, NuGScnDuplicate (sceneman), the Read*Set helpers of NuGScnLoadFix
"nu3d/nugscn" = { treatment = "compile", override = ["NuGScnLoad", "NuGScnLoadFix", "ReadObjSet", "ReadAnimationLibrary",
    "CvtNuIFF*", "CvtNodes", "MakeFaceOnDma", "NuGScnConvertScene", "NuGScnSetTmpWkspc", "NuGScnDuplicate", "NuNodeRead",
    "ReadNuIFFTexAnimSet", "ReadTextureSet", "ReadMaterialSet", "ReadTexAnimSet", "ReadSplineSet"] }
"nu3d/asmstrm" = { treatment = "hle" }
# NuGHGFixupGobj (an int base): done by NuGHGRead; NuHGobjDestroy frees the port's records; dead: NuGHGWrite*,
# ReadNuIFFCollideData
"nu3d/nuhgobj" = { treatment = "compile", override = ["NuGHGRead", "NuGHGFixupGobj", "NuHGobjDestroy", "NuGHGWrite*",
    "ReadNuIFFCollideData"] }
# called: ReadNuIFFGeom's, reached only from .nus/.hgo readers the PS2 never calls; NuPs2DestroyRenderStream leaves
# the port's meshes to their scene
"nu3d/nucvtgeo" = { treatment = "dead", override = ["NuPs2DestroyRenderStream"], called = ["NuPs2CreateRenderStream",
    "NuPs2CreateFaceOn"] }
# NuCvtSknInstFix: done by NuGHGRead's skin DMA decode
"nu3d/nucvtskn" = { treatment = "dead", called = ["NuPs2CreateSkin"] }
"nu3d/asmgobj" = { treatment = "hle" }
"nu3d/nutexanm" = { treatment = "compile" }
"nu3d/nufpatch" = { treatment = "dead" }
"nu3d/nutexcmp" = { treatment = "dead" }
"nu3d/nuwater" = { treatment = "compile", override = ["animateWater", "animateWaterTables"], expose = [
    "nwater_mtl", "nwater_tables", "water_mtls", "water_mtl_tables", "water_table"] }
"nu3d/bitconv" = { treatment = "compile" }

# nups2
"nups2/ps2txtr" = { treatment = "replace" }
"nups2/ps2video" = { treatment = "replace" }
"nups2/vu1man" = { treatment = "replace" }
"nups2/ps2dma" = { treatment = "replace" }
"nups2/ps2ctl" = { treatment = "compile" }
"nups2/ptl" = { treatment = "replace" }
"nups2/asmdma" = { treatment = "replace" }
"nups2/clipping" = { treatment = "compile" }

# gamelib
"gamelib/terrain" = { treatment = "compile", override = ["ReadTerrain"] }
"gamelib/debris" = { treatment = "compile" }
"gamelib/edptl" = { treatment = "editor", runtime = ["ParticleReset", "edppDestroyAll*",
    "edppRegisterPointerToGameCharLocation", "edppLoadEffects", "edppMergeEffects", "edppRestartAllEffectsInLevel",
    "FileLoadSingleEffectType", "UpdateTotalPtls", "TidyAllEffects", "edppDetermineNearest"] }
"gamelib/edobj" = { treatment = "editor", runtime = ["edobjUpdateObjects", "edobjRenderObjects", "edobjRenderCutoffTest",
    "edobjDetermineNearestObject", "edobjConvertPathToAnim", "edobjSoundDestroy", "edobjParticleDestroy",
    "edobjFileLoadObjects", "edobjResetAnimsToZero", "edobjRegisterBaseScene", "edobjObjectReset", "edobjLookupInstance*",
    "edobjPlayerObjectDistance"] }
"gamelib/glutils" = { treatment = "compile" }
"gamelib/edanim" = { treatment = "editor", runtime = ["edanimUpdateObjects", "edanimDetermineNearestAnim",
    "edanimSoundDestroy", "edanimParticleDestroy", "edanimFileLoad", "edanimLookupInstanceIndex",
    "edanimRegisterBaseScene", "edanimLookupSpecial", "edanimParamReset"] }
"gamelib/edbits" = { treatment = "compile" }
"gamelib/edfile" = { treatment = "compile" }
"gamelib/specterr" = { treatment = "compile" }
"gamelib/saveload" = { treatment = "replace" }
# The *FixPtrs (an int base) are done by the port's NuGCutSceneLoad
"gamelib/gcutscn" = { treatment = "compile", override = ["NuGCutSceneLoad", "NuGCut*SysFixPtrs", "StateAnimFixPtrs"] }
# dead: NuTriggerSysLoad, called only by sceneman's NuSceneDataLoad; the disc has no .trg
"gamelib/trigger" = { treatment = "compile", override = ["NuTriggerSysLoad"] }
# called: from the trigger systems, which only sceneman creates
"gamelib/sceneman" = { treatment = "dead", called = ["NuSceneInstanceRunScript"] }
"gamelib/nubridge" = { treatment = "compile", override = ["NuBridgeStreamRope"] }
"gamelib/nuwind" = { treatment = "compile" }
"gamelib/edgra" = { treatment = "editor", runtime = ["edgraInitAllClumps", "edgraDetermineNearestClump", "edgraFileLoad",
    "edgraClumpsReset"] }

# edtools
# called: behind editor_active
"edtools/edmain" = { treatment = "editor", runtime = ["edmainRegisterLocVec", "edmainQueryLocVec"], called = [
    "edmainProcess", "edmainRender"] }
"edtools/edui" = { treatment = "editor" }
"edtools/edcam" = { treatment = "editor" }

# nusound
"nusound/nusound" = { treatment = "compile" }

# game
"game/main" = { treatment = "compile", rename = { main = "nw_game_main" } }
"game/particle" = { treatment = "compile" }
"game/listman" = { treatment = "compile" }
"game/creature" = { treatment = "compile", wrap = ["DrawCreatures"] }
"game/inst" = { treatment = "compile" }
"game/camera" = { treatment = "compile" }
"game/game" = { treatment = "compile", wrap = ["DrawMenu"] }
"game/crate" = { treatment = "compile", override = ["AddQuad3DrotXYZ"] }
"game/game_obj" = { treatment = "compile", wrap = ["MoveLoopXZ"] }
"game/visi" = { treatment = "compile" }
"game/vehicle" = { treatment = "compile" }
"game/vehsupp" = { treatment = "compile" }
"game/vehterr" = { treatment = "compile" }
"game/jeep" = { treatment = "compile" }
"game/edcrate" = { treatment = "editor" }
"game/ai" = { treatment = "compile" }
"game/edwumpa" = { treatment = "editor" }
"game/edai" = { treatment = "editor" }
"game/font3d" = { treatment = "compile", override = ["Text3D"] }
"game/glass" = { treatment = "compile" }
"game/panel" = { treatment = "compile" }
"game/text" = { treatment = "compile", override = ["NewLanguage"] }
"game/edlight" = { treatment = "editor" }
"game/lights" = { treatment = "compile" }
"game/deb3" = { treatment = "compile" }
"game/shadcom" = { treatment = "compile", override = ["ShadRndr", "ShadDataLoad"], expose = ["palids"] }
"game/visidat" = { treatment = "compile" }
"game/cloudfx" = { treatment = "compile", override = ["cloudRender"] }
"game/sfx" = { treatment = "compile" }
"game/move" = { treatment = "compile", wrap = ["AnimateCRASH", "MoveCRASH"] }
"game/chase" = { treatment = "compile" }
"game/loadsave" = { treatment = "compile" }
"game/bgload" = { treatment = "compile" }
"game/cut" = { treatment = "compile", expose = ["cutworldix", "CutInst"] }
"game/bug" = { treatment = "compile" }
"game/game_deb" = { treatment = "compile" }
"game/credits" = { treatment = "compile" }
"game/vu" = { treatment = "replace" }

# sdk: fdlibm and rand are built for the host (same libm everywhere, PS2 RAND_MAX)
"sdk/*" = { treatment = "shim" }
"sdk/newlib/libm/*" = { treatment = "compile" }
"sdk/newlib/libc/stdlib/rand" = { treatment = "compile" }
