# The port patches over the decomp, applied in this order by tools/patches.py (README, "Changing the
# game"). A concern is a directory of <decomp path>.patch files; new files live in files/. Every
# patch keeps the PS2 build unchanged: its seams expand to the decomp's own text without NW_HOST.
# tools/patches.py rebuild writes this file.
schema = 1

[[concern]]
name = "10-host-base"
reason = "Builds the decomp for the host: the host branches of the platform headers, the nu_port.h includes, host prototypes and module headers, retail's mismatched prototypes in definition order, host-only casts."

[[concern]]
name = "20-lvalue"
reason = "Cast-as-lvalue stores and loads (NW_PUT, NW_GET), which clang rejects."

[[concern]]
name = "40-ee-faithful"
reason = "The EE's results where the host's differ: float division by zero, saturating float to int, retail's reads past an object (NW_EE_*, NW_RETAIL, NW_PAST, NW_HOST_INIT, ...)."

[[concern]]
name = "50-host-memory"
reason = "64-bit layouts and heaps: host records beside the PS2 heaps (NW_HEAP_*), the superbuffer, locals retail hands out, record strides and pointer halves."

[[concern]]
name = "60-host-loop"
reason = "Busy-waits that yield to the host (NW_HOST_IDLE)."

[[concern]]
name = "70-widescreen"
reason = "Hor+ widescreen (NW_WIDE*)."

[[concern]]
name = "80-interp"
reason = "Display-rate interpolation keys and snaps (NW_INTERP_*)."

[[concern]]
name = "90-hz"
reason = "The attract demos at 60 Hz (NW_DEMOS); the 50/60 Hz values are rules in port/values/hz.toml."
