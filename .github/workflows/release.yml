name: release

# A v* tag builds and checks everything build.yml does, then drafts the GitHub release with the packages, their
# SHA256SUMS and a build attestation; it is published by hand. Run by hand, it is a dry run: the packages are an
# artifact, nothing is released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is CMakeLists.txt's version
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(python3 tools/package.py version)"

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: crashwoc-nuworld-*
          path: dist
      - name: Package
        run: |
          version="$(python3 tools/package.py version)"
          python3 tools/package.py archive "CrashWOC-NuWorld-v$version" out dist/crashwoc-nuworld-*
      - name: Sign the checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          key="$(mktemp)"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          public="$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | xxd -p -c 32)"
          tr -d ' ,\r\n' < src/updater/pubkey.h | sed 's/0x//g' | grep -q "$public"
          openssl pkeyutl -sign -inkey "$key" -rawin -in out/SHA256SUMS -out out/SHA256SUMS.sig
          rm "$key"
      - name: List the programs to check before publishing
        run: |
          {
            echo "Upload these programs to https://www.virustotal.com/gui/home/upload before publishing."
            echo "If Microsoft flags one there, submit it at https://www.microsoft.com/en-us/wdsi/filesubmission first."
            echo
            echo "| Program | SHA-256 |"
            echo "| --- | --- |"
            for program in dist/crashwoc-nuworld-windows-x64/*.exe; do
              hash="$(sha256sum "$program" | cut -d' ' -f1)"
              echo "| $(basename "$program") | [$hash](https://www.virustotal.com/gui/file/$hash) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/CrashWOC-NuWorld-*
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
          --title "CrashWOC: NuWorld v$(python3 tools/package.py version --full)" out/*
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: out/
