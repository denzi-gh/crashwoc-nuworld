name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deny-gamedata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/deny_gamedata.py

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libclang
        run: python3 -m pip install -r tools/requirements.txt
      - name: Check port/units.toml against the decomp
        run: python3 tools/gen_stubs.py --check
      - name: Generate wrappers, stubs and function map
        run: |
          python3 tools/tu_filter.py --out build/gen
          python3 tools/gen_stubs.py --out build/gen
          python3 tools/gen_funcmap.py --out build/gen
      - name: Type DB
        run: python3 tools/typedb.py --out build/gen
      - uses: actions/upload-artifact@v4
        with:
          name: typedb
          path: build/gen/typedb.json
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
        env:
          CC: clang

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ./build/release/nuworld --version
      - uses: actions/upload-artifact@v4
        with:
          name: nuworld-linux-x86_64
          path: build/release/nuworld

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ./build/release/nuworld.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: nuworld-windows-x64
          path: build/release/nuworld.exe
