name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One self-hosted runner: a newer push to a PR replaces its queued or running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Linux checks and build run in containers on the self-hosted Windows runner (.github/ci/linux.sh).
  linux:
    runs-on: [self-hosted, nuworld]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build the CI image
        run: docker build -q -t nuworld-ci -f .github/ci/linux.Dockerfile tools
      - name: Game data check, generators, unit tests, build and tests
        run: docker run --rm -v "${{ github.workspace }}:/src:ro" -v "${{ runner.temp }}/linux:/out" nuworld-ci bash /src/.github/ci/linux.sh build
      - name: Check the type DB against the PS2 compiler
        run: |
          docker pull -q ghcr.io/denzi-gh/crashwoc-decomp:latest
          docker run --rm -v "${{ github.workspace }}:/src:ro" -v "${{ runner.temp }}/linux:/out" ghcr.io/denzi-gh/crashwoc-decomp:latest bash /src/.github/ci/linux.sh probe
      - uses: actions/upload-artifact@v4
        with:
          name: crashwoc-nuworld-linux-x86_64
          path: ${{ runner.temp }}/linux/crashwoc-nuworld

  sanitize:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y ninja-build ccache libclang-rt-22-dev
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          python3 -m pip install -r tools/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: sanitize-${{ github.sha }}
          restore-keys: sanitize-
      # SDL without its desktop backends: no test opens a window or plays sound.
      - run: >-
          cmake --preset fuzz -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF -DSDL_ALSA=OFF -DSDL_JACK=OFF -DSDL_PIPEWIRE=OFF
          -DSDL_PULSEAUDIO=OFF -DSDL_SNDIO=OFF -DSDL_DBUS=OFF -DSDL_IBUS=OFF -DSDL_LIBUDEV=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
      - run: cmake --build --preset fuzz
      - name: The tests and the seeds under ASan and UBSan
        run: ctest --test-dir build/fuzz -j 4 --output-on-failure
      - name: Fuzz the readers
        run: |
          mkdir -p build/fuzz/corpus build/fuzz/crashes
          build/fuzz/nuworld_fuzz_vfs -max_total_time=25 -print_final_stats=1 \
            -artifact_prefix=build/fuzz/crashes/ build/fuzz/corpus build/fuzz/fuzz-seeds
          # A rejected file is a fatal error the harness returns from: what the load held leaks, as in retail.
          mkdir -p build/fuzz/corpus-loaders
          build/fuzz/nuworld_fuzz_loaders -max_total_time=25 -print_final_stats=1 -detect_leaks=0 -close_fd_mask=1 \
            -artifact_prefix=build/fuzz/crashes/ build/fuzz/corpus-loaders build/fuzz/fuzz-seeds-loaders
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/crashes/

  windows:
    runs-on: [self-hosted, nuworld]
    # The runner machine's MSYS2 (C:\msys64) with clang, cmake, ninja and git from CLANG64.
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
    env:
      MSYSTEM: CLANG64
      CHERE_INVOKING: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The generators run on this Python with pip's libclang, as in the Linux build.
      - name: Python with libclang
        shell: pwsh
        run: |
          $py = "${{ runner.tool_cache }}\nuworld-py"
          if (-not (Test-Path "$py\Scripts\python.exe")) { python -m venv $py }
          & "$py\Scripts\python.exe" -m pip install -q -r tools/requirements.txt
          "NUWORLD_PY=$py\Scripts\python.exe" >> $env:GITHUB_ENV
      - run: cmake --preset release -DPython3_EXECUTABLE="$(cygpath -m "$NUWORLD_PY")"
      - run: cmake --build --preset release
      - run: ctest --test-dir build/release --output-on-failure
      - run: |
          test "$(./build/release/crashwoc-nuworld.exe --version)" = "CrashWOC: NuWorld 0.7.0"
      - name: Check the data image, the scenes and the boot without data
        run: |
          for mode in --check-data --check-scenes "--scene LEVELS/B/HUB/HUB.GSC" --boot-check; do
            status=0
            ./build/release/crashwoc-nuworld.exe --data-dir "$(mktemp -d)" $mode || status=$?
            test "$status" = 2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: crashwoc-nuworld-windows-x64
          path: build/release/crashwoc-nuworld.exe


  archive:
    needs: [linux, windows]
    if: github.event_name == 'push'
    runs-on: [self-hosted, nuworld]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: crashwoc-nuworld-*
          path: ${{ runner.temp }}/dist
      - name: Package and publish to the archive repo
        env:
          GH_TOKEN: ${{ secrets.NUWORLD_BUILDS_TOKEN }}
        run: >-
          docker run --rm -e GH_TOKEN -e GITHUB_SHA -e GITHUB_SERVER_URL -e GITHUB_REPOSITORY
          -e GITHUB_EVENT_PATH=/event.json -v "${env:GITHUB_EVENT_PATH}:/event.json:ro"
          -v "${{ runner.temp }}/dist:/dist" -v "${{ github.workspace }}/.github/ci:/ci:ro"
          ubuntu:24.04 bash /ci/archive.sh
