name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deny-gamedata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/deny_gamedata.py

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libclang
        run: python3 -m pip install -r tools/requirements.txt
      - name: Check port/units.toml against the decomp
        run: python3 tools/gen_stubs.py --check
      - name: Generate wrappers, stubs and function map
        run: |
          python3 tools/tu_filter.py --out build/gen
          python3 tools/gen_stubs.py --out build/gen
          python3 tools/gen_funcmap.py --out build/gen
      - name: Type DB
        run: python3 tools/typedb.py --out build/gen
      - name: Check the PS2 mirror structs, the converters and the data image
        run: |
          python3 tools/gen_ps2types.py --check
          python3 tools/gen_converters.py --check
          python3 tools/gen_dataimage.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: typedb
          path: build/gen/typedb.json
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
        env:
          CC: clang

  typedb-probe:
    needs: tools
    runs-on: ubuntu-latest
    container: ghcr.io/denzi-gh/crashwoc-decomp:latest
    env:
      NUWORLD_PROBE_DIRECT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: typedb
          path: build/gen
      - name: Install the decomp toolchain
        working-directory: decomp
        run: python3 tools/setup_toolchain.py --download
      - name: Check the type DB against the PS2 compiler
        run: python3 tools/typedb_probe.py

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          # clang 22 from apt.llvm.org: the same compiler as MSYS2 CLANG64 (22.04 ships 14).
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          python3 -m pip install -r tools/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --test-dir build/release --output-on-failure
      - run: |
          test "$(./build/release/crashwoc-nuworld --version)" = "CrashWOC: NuWorld 0.1.0"
      - name: Check default data folder
        run: |
          data_home="$(mktemp -d)"
          status=0
          XDG_DATA_HOME="$data_home" ./build/release/crashwoc-nuworld --verify > "$data_home/verify.log" 2>&1 || status=$?
          test "$status" = 1
          test -d "$data_home/crashwoc-nuworld"
          test ! -e "$data_home/NuWorld"
          grep -F "$data_home/crashwoc-nuworld/disc/" "$data_home/verify.log"
      - name: Check the data image, the scenes and the boot without data
        run: |
          for mode in --check-data --check-scenes "--scene LEVELS/B/HUB/HUB.GSC" --boot-check; do
            status=0
            ./build/release/crashwoc-nuworld --data-dir "$(mktemp -d)" $mode || status=$?
            test "$status" = 2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: crashwoc-nuworld-linux-x86_64
          path: build/release/crashwoc-nuworld

  sanitize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y ninja-build ccache libclang-rt-22-dev
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          python3 -m pip install -r tools/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: sanitize-${{ github.sha }}
          restore-keys: sanitize-
      # SDL without its desktop backends: no test opens a window or plays sound.
      - run: >-
          cmake --preset fuzz -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF -DSDL_ALSA=OFF -DSDL_JACK=OFF -DSDL_PIPEWIRE=OFF
          -DSDL_PULSEAUDIO=OFF -DSDL_SNDIO=OFF -DSDL_DBUS=OFF -DSDL_IBUS=OFF -DSDL_LIBUDEV=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
      - run: cmake --build --preset fuzz
      - name: The tests and the seeds under ASan and UBSan
        run: ctest --test-dir build/fuzz -j 4 --output-on-failure
      - name: Fuzz the readers
        run: |
          mkdir -p build/fuzz/corpus build/fuzz/crashes
          build/fuzz/nuworld_fuzz_vfs -max_total_time=25 -print_final_stats=1 \
            -artifact_prefix=build/fuzz/crashes/ build/fuzz/corpus build/fuzz/fuzz-seeds
          # A rejected file is a fatal error the harness returns from: what the load held leaks, as in retail.
          mkdir -p build/fuzz/corpus-loaders
          build/fuzz/nuworld_fuzz_loaders -max_total_time=25 -print_final_stats=1 -detect_leaks=0 -close_fd_mask=1 \
            -artifact_prefix=build/fuzz/crashes/ build/fuzz/corpus-loaders build/fuzz/fuzz-seeds-loaders
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/crashes/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The generators run on this Python with pip's libclang, as in the linux and tools jobs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
      - name: Install libclang
        run: '"$(cygpath -u "$pythonLocation")/python.exe" -m pip install -r tools/requirements.txt'
      - run: cmake --preset release -DPython3_EXECUTABLE="$(cygpath -m "$pythonLocation")/python.exe"
      - run: cmake --build --preset release
      - run: ctest --test-dir build/release --output-on-failure
      - run: |
          test "$(./build/release/crashwoc-nuworld.exe --version)" = "CrashWOC: NuWorld 0.1.0"
      - name: Check the data image, the scenes and the boot without data
        run: |
          for mode in --check-data --check-scenes "--scene LEVELS/B/HUB/HUB.GSC" --boot-check; do
            status=0
            ./build/release/crashwoc-nuworld.exe --data-dir "$(mktemp -d)" $mode || status=$?
            test "$status" = 2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: crashwoc-nuworld-windows-x64
          path: build/release/crashwoc-nuworld.exe


  archive:
    needs: [linux, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.NUWORLD_BUILDS_TOKEN }}
      ARCHIVE_REPO: denzi-gh/denzi-gh-crashwoc-nuworld-builds
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: crashwoc-nuworld-*
          path: dist
      - name: Package
        run: |
          tag="build-$(jq -r '.head_commit.timestamp[0:10]' "$GITHUB_EVENT_PATH" | tr -d -)-${GITHUB_SHA::7}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          chmod +x dist/crashwoc-nuworld-linux-x86_64/crashwoc-nuworld
          tar -C dist/crashwoc-nuworld-linux-x86_64 -czf "$tag-linux-x86_64.tar.gz" crashwoc-nuworld
          (cd dist/crashwoc-nuworld-windows-x64 && zip -q "../../$tag-windows-x64.zip" crashwoc-nuworld.exe)
          {
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            echo
            jq -r '.commits[] | "- \(.id[0:7]) \(.message | split("\n")[0])"' "$GITHUB_EVENT_PATH"
          } > notes.md
      - name: Publish to the archive repo
        run: |
          if gh release view "$TAG" --repo "$ARCHIVE_REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$ARCHIVE_REPO" --clobber "$TAG"-*
          else
            gh release create "$TAG" --repo "$ARCHIVE_REPO" --title "$TAG" --notes-file notes.md "$TAG"-*
          fi
