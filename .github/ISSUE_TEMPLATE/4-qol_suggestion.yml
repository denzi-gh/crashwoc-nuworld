name: Quality of Life suggestion
description: A small change that makes the game more convenient to play (faster menus, skippable intros, better saving).
title: "[QoL]: "
labels: ["qol"]
body:
  - type: markdown
    attributes:
      value: |
        One suggestion per issue. Bigger additions go in a Feature request.
  - type: textarea
    id: description
    attributes:
      label: What bothers you, and what would you change?
      placeholder: "Example: The intro videos play every time the game starts. They should be skippable."
    validations:
      required: true
