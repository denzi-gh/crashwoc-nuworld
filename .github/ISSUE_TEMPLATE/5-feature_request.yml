name: Feature request
description: A bigger addition to the port (widescreen, high framerate, rebinding, mod support).
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One feature per issue. NuWorld plays like the original by default, so changes to how it plays become options.
  - type: textarea
    id: description
    attributes:
      label: What should the feature do?
    validations:
      required: true
