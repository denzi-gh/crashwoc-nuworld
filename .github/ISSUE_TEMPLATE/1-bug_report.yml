name: Bug report
description: Something in the port works wrong (rendering, input, audio, menus, gameplay).
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One bug per issue. Never attach or link game files or disc images.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected instead, and the level or area if it matters.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enter warp room 1
        2. Go to ...
        3. See ...
  - type: input
    id: version
    attributes:
      label: NuWorld version and OS
      placeholder: "Example: NuWorld 0.1.0, Windows 11"
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots, video, log or save file
      description: Drag files in here. The log is `nuworld.log` in the NuWorld data folder.
