name: Accuracy issue
description: NuWorld looks, sounds or plays different from the original PS2 game.
title: "[Accuracy]: "
labels: ["accuracy"]
body:
  - type: markdown
    attributes:
      value: |
        NuWorld aims to match the PAL v1.03 PS2 release. Never attach or link game files or disc images.
  - type: textarea
    id: description
    attributes:
      label: What is different?
      description: Where it happens and how to see it.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: From NuWorld and, if you can, from the original game (say whether that is a real PS2, PCSX2 or a video).
  - type: input
    id: version
    attributes:
      label: NuWorld version and OS
      placeholder: "Example: NuWorld 0.1.0, Windows 11"
    validations:
      required: true
