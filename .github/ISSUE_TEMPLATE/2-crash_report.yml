name: Crash / freeze / won't start
description: The port crashes, freezes, hangs or does not start.
title: "[Crash]: "
labels: ["bug", "crash"]
body:
  - type: markdown
    attributes:
      value: |
        If it crashes on startup, update your graphics driver first. Never attach or link game files or disc images.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you were doing right before, and whether it happens every time.
      placeholder: "Example: Collected the last crystal in Arctic Antics, the game froze on the level end screen. Happens every time."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NuWorld version and OS
      placeholder: "Example: NuWorld 0.1.0, Windows 11"
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Log, screenshots or save file
      description: Drag files in here. The log is `nuworld.log` in the NuWorld data folder.
