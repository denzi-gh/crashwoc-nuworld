name: Build problem
description: The port fails to configure, compile or link from source.
title: "[Build]: "
labels: ["build"]
body:
  - type: markdown
    attributes:
      value: |
        Most build failures come from a missing submodule (`git submodule update --init --recursive`)
        or, on Windows, from not using an MSYS2 **CLANG64** shell.
  - type: input
    id: environment
    attributes:
      label: Commit and OS
      placeholder: "Example: 5e766a9, Windows 11 MSYS2 CLANG64"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Build log
      description: The full output of the failing command.
      render: text
    validations:
      required: true
